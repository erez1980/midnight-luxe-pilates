    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // The lesson-builder app used to live at this URL. Lesson share links
      // (?s= / ?sharedLesson=) and Supabase sign-in callbacks that still point
      // here are forwarded to the app, with their query and hash intact.
      (function () {
        var q = new URLSearchParams(location.search);
        var h = location.hash;
        if (q.has('s') || q.has('sharedLesson') || q.has('code') || /access_token=|error_description=/.test(h)) {
          location.replace('./app/' + location.search + h);
          return;
        }

        // Language: the first visit picks Hebrew or English automatically —
        // a Hebrew browser language wins anywhere in the world, otherwise an
        // Israeli time zone means Hebrew, and everyone else gets /en/. A choice
        // made with the flag switcher is remembered and always wins. Search
        // engine and link-preview crawlers are never redirected, so both
        // language versions stay indexed (hreflang below links them).
        var pref = null;
        try { pref = localStorage.getItem('site-lang'); } catch (e) {}
        if (pref === 'en') { location.replace('./en/' + h); return; }
        if (pref === 'he') return;
        if (/bot|crawl|spider|slurp|preview|facebookexternalhit|whatsapp|telegram|linkedin|embedly|lighthouse/i.test(navigator.userAgent)) return;
        var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).join(',').toLowerCase();
        if (/(^|,)(he|iw)(-|,|$)/.test(langs)) return;
        var tz = '';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
        if (tz === 'Asia/Jerusalem' || tz === 'Asia/Tel_Aviv') return;
        location.replace('./en/' + h);
      })();
    </script>
